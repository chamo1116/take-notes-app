allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
onlyBuiltDependencies:
  - esbuild
  - sharp
  - unrs-resolver
overrides:
  # next vendors its own exact postcss/sharp pins internally; force the
  # patched versions everywhere in the tree, including inside next itself.
  postcss: ">=8.5.18"
  sharp: ">=0.35.0"
