[project]
name = "take-notes-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<5.3",
    "djangorestframework>=3.15,<3.16",
    "djangorestframework-simplejwt>=5.5,<5.6",
    "django-cors-headers>=4.4,<4.5",
    "django-environ>=0.11,<0.12",
    "psycopg[binary]>=3.1,<3.2",
]

[dependency-groups]
dev = [
    "pytest>=9.0,<10.0",
    "pytest-django>=4.8,<4.9",
    "pytest-cov>=5.0,<6.0",
    "factory-boy>=3.3,<3.4",
    "ruff>=0.6,<0.7",
    "mypy>=1.13,<2.0",
    "django-stubs[compatible-mypy]>=5.2,<5.3",
    "djangorestframework-stubs>=3.15,<3.16",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["E501", "I001"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
strict = true
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings.dev"

# factory_boy ships no type stubs, so calls into its DSL (Sequence,
# PostGenerationMethodCall, factory-produced constructors) are unavoidably
# untyped under mypy --strict. Relax just the affected checks for tests.
[[tool.mypy.overrides]]
module = "accounts.tests.*"
disallow_untyped_calls = false
disallow_any_generics = false
disallow_untyped_decorators = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
python_files = ["test_*.py"]
addopts = "--reuse-db"
